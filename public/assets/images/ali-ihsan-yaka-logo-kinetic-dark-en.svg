<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="540" height="130" fill="none" role="img" aria-label="DR. ALI IHSAN YAKA">
  <defs>
    <style>
      .logo-title {
        font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #F8FAFC;
      }
      .logo-sub1 {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.24em;
        fill: #D4AF37;
      }
      .logo-sub2 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.16em;
        fill: #94A3B8;
      }
    </style>
    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== BESPOKE CLINICAL EMBLEM (Ψ ARCHIVAL SEAL) ==================== -->
  <g transform="translate(56, 65)" filter="url(#subtleGlow)">
    <!-- Archival Seal Roundel -->
    <circle cx="0" cy="0" r="44" fill="#0F1A28" stroke="#D4AF37" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Subtle Cardinal Accents -->
    <circle cx="0" cy="-39" r="1.8" fill="#D4AF37"/>
    <circle cx="0" cy="39" r="1.8" fill="#D4AF37"/>
    <circle cx="-39" cy="0" r="1.8" fill="#D4AF37"/>
    <circle cx="39" cy="0" r="1.8" fill="#D4AF37"/>

    <!-- Classical Greek Letter Ψ (Psi - Symbol of Psyche, Mind & Psychoanalysis) -->
    <!-- Base Pedestal Serif -->
    <path d="M-12 25 h24" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Center Vertical Stem -->
    <path d="M0 25 V-24" stroke="#F8FAFC" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Stem Top Serif -->
    <path d="M-7 -24 h14" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Sweeping Classical Lateral Bowl -->
    <path d="M-21 -16 C-21 11, -5 13, 0 13 C5 13, 21 11, 21 -16" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left & Right Arm Serifs -->
    <path d="M-26 -16 h10" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 -16 h10" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Central Gold Focal Node -->
    <circle cx="0" cy="13" r="2.6" fill="#D4AF37"/>
  </g>

  <!-- Elegant Vertical Divider Spine -->
  <line x1="116" y1="25" x2="116" y2="105" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <circle cx="116" cy="65" r="2" fill="#D4AF37" opacity="0.8"/>

  <!-- ==================== REFINED TYPOGRAPHY LOCKUP ==================== -->
  <g transform="translate(132, 0)">
    <text x="0" y="51" class="logo-title">DR. ALI IHSAN YAKA</text>
    <line x1="1" y1="63" x2="220" y2="63" stroke="#D4AF37" stroke-width="1.4" opacity="0.75"/>
    <circle cx="226" cy="63" r="1.8" fill="#D4AF37"/>
    <text x="2" y="82" class="logo-sub1">PSYCHOANALYSIS &amp; CLINICAL PSYCHOLOGY</text>
    <text x="2" y="100" class="logo-sub2">SUNY BUFFALO CSPC • METU PH.D.</text>
  </g>
</svg>