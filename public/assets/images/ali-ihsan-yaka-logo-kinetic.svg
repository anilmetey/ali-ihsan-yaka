<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" fill="none" role="img" aria-label="DR. ALİ İHSAN YAKA">
  <defs>
    <style>
      .logo-title {
        font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: 0.16em;
        fill: #0E2942;
      }
      .logo-sub1 {
        font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.28em;
        fill: #9B7438;
      }
      .logo-sub2 {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.18em;
        fill: #516579;
      }
      .knot-ring {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== BORROMEAN KNOT EMBLEM ==================== -->
  <g transform="translate(54, 65)" filter="url(#glow)">
    <!-- Center scale & coordinates:
         R = 25.5
         Top Ring (Symbolic): cx=0, cy=-14
         Left Ring (Imaginary): cx=-13, cy=11
         Right Ring (Real): cx=13, cy=11
    -->
    
    <!-- Outer delicate framing halo -->
    <circle cx="0" cy="2" r="48" stroke="#9B7438" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.45"/>
    <circle cx="0" cy="2" r="44" stroke="#0E2942" stroke-width="0.5" opacity="0.2"/>

    <!-- Ring 1: TOP (Symbolic - S) Under-layers -->
    <circle cx="0" cy="-14" r="26" stroke="#0E2942" stroke-width="3.2" class="knot-ring"/>

    <!-- Ring 2: LEFT (Imaginary - I) with crossings -->
    <!-- Cutout mask at Top-Left overlap -->
    <circle cx="-13" cy="11" r="26" stroke="#FFFFFF" stroke-width="6" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="-22"/>
    <circle cx="-13" cy="11" r="26" stroke="#9B7438" stroke-width="3.2" class="knot-ring"/>

    <!-- Ring 3: RIGHT (Real - R) with crossings -->
    <!-- Cutout mask at Bottom overlap & Top-Right overlap -->
    <circle cx="13" cy="11" r="26" stroke="#FFFFFF" stroke-width="6" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="-54"/>
    <circle cx="13" cy="11" r="26" stroke="#FFFFFF" stroke-width="6" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="18"/>
    <circle cx="13" cy="11" r="26" stroke="#405B73" stroke-width="3.2" class="knot-ring"/>

    <!-- Top Ring over Left Ring crossing weave -->
    <circle cx="0" cy="-14" r="26" stroke="#FFFFFF" stroke-width="6" class="knot-ring" stroke-dasharray="16 147" stroke-dashoffset="-82"/>
    <circle cx="0" cy="-14" r="26" stroke="#0E2942" stroke-width="3.2" class="knot-ring" stroke-dasharray="16 147" stroke-dashoffset="-82"/>

    <!-- Central Triad Jewel (Point of objet petit a) -->
    <circle cx="0" cy="2" r="3.2" fill="#9B7438"/>
    <circle cx="0" cy="2" r="1.4" fill="#FFFFFF"/>

    <!-- Small register mathemes on rings -->
    <text x="0" y="-32" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#0E2942" text-anchor="middle" opacity="0.85">S</text>
    <text x="-31" y="26" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#9B7438" text-anchor="middle" opacity="0.85">I</text>
    <text x="31" y="26" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#405B73" text-anchor="middle" opacity="0.85">R</text>
  </g>

  <!-- Vertical Divider Spine -->
  <line x1="116" y1="26" x2="116" y2="104" stroke="#9B7438" stroke-width="1" opacity="0.35"/>
  <circle cx="116" cy="65" r="2" fill="#9B7438" opacity="0.7"/>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <g transform="translate(132, 0)">
    <!-- Academic / Clinical Title -->
    <text x="0" y="52" class="logo-title">DR. ALİ İHSAN YAKA</text>

    <!-- Horizontal Underline Accent -->
    <line x1="1" y1="64" x2="210" y2="64" stroke="#9B7438" stroke-width="1.4" opacity="0.75"/>
    <circle cx="216" cy="64" r="1.8" fill="#9B7438"/>

    <!-- Subtitle Line 1: Practice / Disciplines -->
    <text x="2" y="83" class="logo-sub1">PSİKANALİZ & KLİNİK PSİKOLOJİ</text>

    <!-- Subtitle Line 2: Institutional Affiliation & Degree -->
    <text x="2" y="101" class="logo-sub2">UNIVERSITY AT BUFFALO CSPC • METU PH.D.</text>
  </g>
</svg>