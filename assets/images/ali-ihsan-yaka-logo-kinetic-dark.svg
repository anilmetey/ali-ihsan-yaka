<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="540" height="130" fill="none" role="img" aria-label="DR. ALİ İHSAN YAKA">
  <defs>
    <style>
      .logo-title {
        font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Didot', 'Times New Roman', 'Georgia', serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.15em;
        fill: #F8FAFC;
      }
      .logo-sub1 {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.26em;
        fill: #D4AF37;
      }
      .logo-sub2 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.16em;
        fill: #94A3B8;
      }
      .knot-ring {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ==================== BORROMEAN KNOT EMBLEM ==================== -->
  <g transform="translate(56, 65)" filter="url(#subtleShadow)">
    <circle cx="0" cy="2" r="48" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4"/>
    <circle cx="0" cy="2" r="44" stroke="#F8FAFC" stroke-width="0.5" opacity="0.2"/>

    <!-- Ring 1: TOP (Symbolic - S) -->
    <circle cx="0" cy="-14" r="26" stroke="#93C5FD" stroke-width="3" class="knot-ring"/>

    <!-- Ring 2: LEFT (Imaginary - I) with crossings -->
    <circle cx="-13" cy="11" r="26" stroke="#0B1523" stroke-width="5.5" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="-22"/>
    <circle cx="-13" cy="11" r="26" stroke="#D4AF37" stroke-width="3" class="knot-ring"/>

    <!-- Ring 3: RIGHT (Real - R) with crossings -->
    <circle cx="13" cy="11" r="26" stroke="#0B1523" stroke-width="5.5" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="-54"/>
    <circle cx="13" cy="11" r="26" stroke="#0B1523" stroke-width="5.5" class="knot-ring" stroke-dasharray="18 145" stroke-dashoffset="18"/>
    <circle cx="13" cy="11" r="26" stroke="#CBD5E1" stroke-width="3" class="knot-ring"/>

    <!-- Top Ring over Left Ring crossing weave -->
    <circle cx="0" cy="-14" r="26" stroke="#0B1523" stroke-width="5.5" class="knot-ring" stroke-dasharray="16 147" stroke-dashoffset="-82"/>
    <circle cx="0" cy="-14" r="26" stroke="#93C5FD" stroke-width="3" class="knot-ring" stroke-dasharray="16 147" stroke-dashoffset="-82"/>

    <circle cx="0" cy="2" r="3.2" fill="#D4AF37"/>
    <circle cx="0" cy="2" r="1.4" fill="#0B1523"/>

    <text x="0" y="-32" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#93C5FD" text-anchor="middle" opacity="0.85">S</text>
    <text x="-31" y="26" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#D4AF37" text-anchor="middle" opacity="0.85">I</text>
    <text x="31" y="26" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#CBD5E1" text-anchor="middle" opacity="0.85">R</text>
  </g>

  <!-- Vertical Divider Spine -->
  <line x1="118" y1="26" x2="118" y2="104" stroke="#D4AF37" stroke-width="1" opacity="0.35"/>
  <circle cx="118" cy="65" r="2" fill="#D4AF37" opacity="0.7"/>

  <!-- ==================== TYPOGRAPHY LOCKUP ==================== -->
  <g transform="translate(134, 0)">
    <text x="0" y="51" class="logo-title">DR. ALİ İHSAN YAKA</text>
    <line x1="1" y1="63" x2="220" y2="63" stroke="#D4AF37" stroke-width="1.4" opacity="0.75"/>
    <circle cx="226" cy="63" r="1.8" fill="#D4AF37"/>
    <text x="2" y="82" class="logo-sub1">PSİKANALİZ &amp; KLİNİK PSİKOLOJİ</text>
    <text x="2" y="100" class="logo-sub2">UNIVERSITY AT BUFFALO CSPC • METU PH.D.</text>
  </g>
</svg>